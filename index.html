<!doctype html>
<html lang="en">

<meta name="description" content="Personal and home finance: daily spending, bills by cutoff, loans, salary and utilities, saved to a Google Sheet in your Drive.">

<style>
/* Prudence: Google Sans Flex on a porcelain palette (see the Prudence design system). Layout: a household passbook. Sticky tab strip; each tab is a single column of panels on phones, two columns on wide screens. */
:root {
  --bg: #eceef5; --surface: #ffffff; --surface-2: #edf2fc; --ink: #27334f; --muted: #5c6782; --line: #dde2ee; --line-strong: #7c869f; --ink-title: #566a90;
  --accent: #4262bc; --accent-ink: #ffffff; --accent-soft: #e0eafb;
  --income: #2b7657; --income-soft: #e3f1ea; --expense: #bb3f2c; --expense-soft: #fbe9e5; --warn: #8a6200; --warn-soft: #f6eed9; --transfer: #8a6200;
  --porcelain: #8ea6c4; --pear: #d1ad46; --cream: #f5edda;
  --c1: #4262bc; --c2: #2b7657; --c3: #d1ad46; --c4: #8ea6c4; --c5: #8ea6c4; --c6: #bb3f2c;
  --overlay: rgba(39,51,79,.38);
  --f-display: "Google Sans Flex", "Google Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --f-body: "Google Sans Flex", "Google Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --f-mono: "Google Sans Flex", "Google Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10131b; --surface: #171b26; --surface-2: #1e2433; --ink: #eef1f8; --muted: #a7b0c5; --line: #2a3142; --line-strong: #6c768f; --ink-title: #b8c6e6;
  --accent: #9db3f0; --accent-ink: #10131b; --accent-soft: #1f2844;
  --income: #5cc59a; --income-soft: #15271f; --expense: #f0806d; --expense-soft: #2e1815; --warn: #e6c15e; --warn-soft: #2b2412; --transfer: #e6c15e;
  --porcelain: #5d7398; --pear: #d9b85a; --cream: #2b2516;
  --c1: #9db3f0; --c2: #5cc59a; --c3: #d9b85a; --c4: #5d7398; --c5: #5d7398; --c6: #f0806d;
  --overlay: rgba(0,0,0,.6); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #10131b; --surface: #171b26; --surface-2: #1e2433; --ink: #eef1f8; --muted: #a7b0c5; --line: #2a3142; --line-strong: #6c768f; --ink-title: #b8c6e6;
  --accent: #9db3f0; --accent-ink: #10131b; --accent-soft: #1f2844;
  --income: #5cc59a; --income-soft: #15271f; --expense: #f0806d; --expense-soft: #2e1815; --warn: #e6c15e; --warn-soft: #2b2412; --transfer: #e6c15e;
  --porcelain: #5d7398; --pear: #d9b85a; --cream: #2b2516;
  --c1: #9db3f0; --c2: #5cc59a; --c3: #d9b85a; --c4: #5d7398; --c5: #5d7398; --c6: #f0806d;
  --overlay: rgba(0,0,0,.6); color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Header + tabs */
.head { padding-block: 18px 6px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 1.7rem; letter-spacing: -0.02em; }
.brand h1 b { color: var(--accent); font-weight: 700; }
.status { font-size: 0.78rem; color: var(--muted); }
.month-nav { display: flex; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.month-nav button { border: 0; background: none; width: 34px; height: 34px; border-radius: 999px; font-size: 1.15rem; color: var(--muted); }
.month-nav button:hover { background: var(--surface-2); color: var(--ink); }
.month-nav span { min-width: 128px; text-align: center; font-weight: 600; }
.tabbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding-block: 6px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { flex: none; text-decoration: none; color: var(--muted); padding: 7px 13px; border-radius: 9px; font-weight: 500; font-size: 0.92rem; white-space: nowrap; }
.tabs a:hover { color: var(--ink); background: var(--surface-2); }
.tabs a[aria-current="page"] { background: var(--ink); color: var(--bg); }
main.wrap { padding-block: 18px 110px; display: flex; flex-direction: column; gap: 18px; }

/* Banner */
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 16px; border-radius: 12px; background: var(--accent-soft); border: 1px dashed var(--accent); }
.banner p { margin: 0; flex: 1 1 300px; min-width: 0; }
.banner strong { color: var(--accent); }

/* Panels */
.cols { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; min-width: 0; }
.panel h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 1.08rem; letter-spacing: -0.01em; text-wrap: balance; }
.phead { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; margin-bottom: 12px; flex-wrap: wrap; }
.eyebrow { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 600; }
.note { font-size: 0.84rem; color: var(--muted); margin: 0; }
.pos { color: var(--income); } .neg { color: var(--expense); } .warn-t { color: var(--warn); }

/* KPI strip */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 0; overflow: hidden; }
.kpi { padding: 16px 18px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.kpi:first-child { border-left: 0; }
.kpi .v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 1.3rem; font-weight: 500; overflow-wrap: anywhere; }
.kpi .s { font-size: 0.8rem; color: var(--muted); }
.kpi.hero { background: var(--surface-2); }
.kpi.hero .v { font-family: var(--f-display); font-weight: 700; font-size: 1.75rem; letter-spacing: -0.02em; }

/* Buttons */
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 10px; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 4px 10px; font-size: 0.84rem; border-radius: 8px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn.danger { color: var(--expense); }
.btn.danger.armed { background: var(--expense); color: var(--surface); border-color: var(--expense); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* Rows */
.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 6px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 2px; border-bottom: 1px dashed var(--line); }
.row:last-child { border-bottom: 0; }
.row .bar6 { width: 6px; height: 32px; border-radius: 3px; background: var(--line); }
.row .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .m { font-size: 0.8rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .r { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.row .amt { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; }
button.row { width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; border-radius: 0; text-align: left; }
button.row:hover { background: var(--surface-2); }
.st-paid .bar6 { background: var(--income); }
.st-over .bar6 { background: var(--expense); }
.st-soon .bar6 { background: var(--warn); }
.st-up .bar6 { background: var(--line); }
.pill { display: inline-block; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.pill.paid { background: color-mix(in srgb, var(--income) 16%, transparent); color: var(--income); }
.pill.over { background: var(--expense); color: var(--surface); }
.pill.soon { background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--warn); }
.pill.up { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.day-head { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--muted); padding: 12px 2px 6px; border-bottom: 1px solid var(--line); }
.day-head:first-child { padding-top: 0; }
.empty { padding: 26px 10px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-family: var(--f-display); font-size: 1.02rem; margin-bottom: 4px; }

/* Cutoff columns */
.cutoffs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.cut-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); margin-bottom: 4px; }
.cut-head h3 { margin: 0; font-family: var(--f-display); font-size: 1rem; }
.cut-head .num { font-size: 0.95rem; }
.cut-foot { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--muted); padding-top: 8px; }

/* Progress */
.prog { height: 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.prog > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.prog.good > i { background: var(--income); }
.prog.warn > i { background: var(--warn); }
.prog.over > i { background: var(--expense); }
.catrow { display: flex; flex-direction: column; gap: 5px; padding: 7px 0; }
.catrow .top { display: flex; justify-content: space-between; gap: 10px; font-size: 0.88rem; }
.catrow .top span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.catrow .top span:last-child { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; font-size: 0.84rem; }

/* Cards grid (loans, people) */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); min-width: 0; }
.card .ct { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
.card h3 { margin: 0; font-size: 1rem; font-weight: 600; overflow-wrap: anywhere; }
.card .big { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 1.25rem; font-weight: 500; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 0.84rem; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.card .acts { display: flex; gap: 6px; flex-wrap: wrap; }

/* Quick add */
.quick { display: flex; flex-direction: column; gap: 12px; }
.amount-field { position: relative; }
.amount-field span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-family: var(--f-display); font-weight: 700; font-size: 1.3rem; color: var(--muted); pointer-events: none; }
.amount-field input { width: 100%; font-family: var(--f-mono); font-size: 1.5rem; padding: 10px 12px 10px 34px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-variant-numeric: tabular-nums; }
.catchips { display: flex; flex-wrap: wrap; gap: 6px; }
.catchips button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 99px; padding: 6px 12px; font-size: 0.86rem; }
.catchips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .lbl { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.field input, .field select { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 9px 10px; width: 100%; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.err { color: var(--expense); font-size: 0.85rem; margin: 0; }

/* Tables */
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 0.86rem; min-width: 560px; }
.tbl th { text-align: right; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl td { padding: 8px; border-bottom: 1px dashed var(--line); text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl td:first-child { font-family: var(--f-body); font-weight: 500; }
.tbl tr.clickable { cursor: pointer; } .tbl tr.clickable:hover td { background: var(--surface-2); }
.tbl tfoot td { border-bottom: 0; border-top: 2px solid var(--ink); font-weight: 600; }

/* Charts */
.chart svg { display: block; width: 100%; height: auto; }

.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.callout { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; padding: 10px 12px; background: var(--surface-2); border-radius: 10px; margin-top: 10px; font-size: 0.88rem; }
.callout b { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-weight: 500; color: var(--income); }

/* Sheet */
.overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 50; display: flex; justify-content: center; align-items: flex-start; overflow-y: auto;
  padding: calc(24px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; width: 100%; max-width: 560px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.sheet h2 { margin: 0; font-family: var(--f-display); font-size: 1.3rem; }
.sheet form { display: flex; flex-direction: column; gap: 12px; }
.sheet-acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; padding-top: 6px; border-top: 1px solid var(--line); }
.sheet-acts .spacer { flex: 1; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 70; font-size: 0.9rem; max-width: calc(100% - 32px); }
.fab { position: fixed; right: max(18px, calc(env(safe-area-inset-right, 0px) + 12px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 30; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; padding: 14px 20px; border-radius: 999px; box-shadow: 0 6px 20px rgba(0,0,0,.18); }

.cuts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.cut { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.cut-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding-bottom: 6px; border-bottom: 2px solid var(--ink); }
.flow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 0.86rem; }
.flow-lbl { color: var(--muted); }
.flow-track { height: 10px; border-radius: 99px; background: var(--surface-2); display: flex; overflow: hidden; }
.flow-track i { display: block; height: 100%; }
.cut-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.leftover-row { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; margin-top: 6px; padding-top: 8px; border-top: 1px dashed var(--line); }
.leftover-row > span { display: flex; flex-direction: column; align-items: center; font-size: 0.82rem; }
.leftover-row b { font-weight: 500; }
.debt-top { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 10px; }
.big-fig { font-size: 1.35rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.pace { display: flex; flex-direction: column; gap: 10px; }
.pace-track { position: relative; height: 12px; border-radius: 99px; background: var(--surface-2); }
.pace-track i { display: block; height: 100%; border-radius: 99px; }
.pace-track b { position: absolute; top: -4px; width: 2px; height: 20px; background: var(--ink); transform: translateX(-1px); }
.pace-nums { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.bal { display: flex; flex-direction: column; }
.bal-row { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 0.92rem; }
.bal-row.total { border-bottom: 0; border-top: 2px solid var(--ink); font-weight: 600; margin-top: 2px; }
@media (max-width: 560px) { .cuts { grid-template-columns: minmax(0, 1fr); } }
.ustats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 10px 0 14px; border-bottom: 1px dashed var(--line); margin-bottom: 12px; }
.ustats > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ustats b { font-weight: 500; font-size: 1.05rem; }
.ugrid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.ucell { min-width: 0; } .ustack { display: flex; flex-direction: column; gap: 12px; }
.uh { margin: 0 0 4px; font-size: 0.82rem; font-weight: 600; color: var(--muted); letter-spacing: 0.01em; }
@media (max-width: 760px) { .ugrid { grid-template-columns: minmax(0, 1fr); } }
.vh { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
.rc-add { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.rc-add label.btn { cursor: pointer; }
.rcs { display: flex; flex-wrap: wrap; gap: 6px; }
.rc { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 4px 4px 4px 8px; max-width: 100%; font-size: 0.85rem; }
.rc img { width: 34px; height: 34px; object-fit: cover; border-radius: 6px; }
.rcn { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 240px; }
.rcx { border: 0; background: none; width: 24px; height: 24px; border-radius: 99px; color: var(--muted); }
.rcx:hover { background: var(--line); color: var(--ink); }
.field textarea { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 9px; padding: 9px 10px; width: 100%; font: inherit; resize: vertical; }
.stackf { display: flex; flex-direction: column; gap: 12px; }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.chk { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); border-radius: 99px; padding: 6px 12px; font-size: 0.88rem; cursor: pointer; }
.chk:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); }
.choice { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt input { margin-top: 3px; }

/* ============ calculations ============ */
function balances(v) {
  const b = {}; v.settings.accounts.forEach((a) => (b[a.id] = Number(a.opening) || 0));
  v.txns.forEach((t) => {
    const a = Number(t.amount) || 0;
    if (t.type === "income") { if (t.account in b) b[t.account] += a; }
    else if (t.type === "expense") { if (t.account in b) b[t.account] -= a; }
    else if (t.type === "transfer") { if (t.account in b) b[t.account] -= a; if (t.to in b) b[t.to] += a; }
  });
  (v.reimb || []).forEach((r) => {
    if (r.account in b) b[r.account] -= Number(r.amount) || 0;
    if (r.claimed && r.toAccount in b) b[r.toAccount] += Number(r.received) || 0;
  });
  for (const k in b) b[k] = r2(b[k]); return b;
}
function loanState(v, l) {
  const pays = v.txns.filter((t) => t.link && t.link.kind === "loan" && t.link.id === l.id && t.date >= (l.asOf || "0000"));
  const paid = sum(pays, (t) => Number(t.amount) || 0);
  const balance = Math.max(0, r2((Number(l.balance) || 0) - paid));
  const left = Math.max(0, (Number(l.left) || 0) - pays.length);
  return { balance, left, pays };
}
function periodPaid(v, kind, id, period) { return v.txns.find((t) => t.link && t.link.kind === kind && t.link.id === id && t.link.period === period); }
function dueItems(v, ym) {
  const items = [];
  ["A", "B"].forEach((c) => {
    const period = ym + "-" + c, due = dueDate(ym, c);
    v.bills.filter((b) => b.cycle === c && b.active !== false).forEach((b) => {
      const p = periodPaid(v, "bill", b.id, period);
      items.push({ kind: "bill", obj: b, id: b.id, name: b.name, amount: b.amount, cycle: c, period, due, paid: p, category: b.category });
    });
    v.loans.forEach((l) => {
      if (!(l.cycle === c || l.cycle === "AB")) return;
      const p = periodPaid(v, "loan", l.id, period);
      const stt = loanState(v, l);
      if (!p && (stt.left <= 0 || due < (l.asOf || "0000"))) return;
      items.push({ kind: "loan", obj: l, id: l.id, name: l.name, amount: l.payment, cycle: c, period, due, paid: p, category: "Loan payments" });
    });
  });
  return items;
}
function statusOf(it) {
  if (it.paid) return "paid";
  const d = daysBetween(todayStr(), it.due);
  if (d < 0) return "over"; if (d <= 5) return "soon"; return "up";
}
const STATUS_LBL = { paid: "Paid", over: "Overdue", soon: "Due soon", up: "Upcoming" };
function monthFlow(v, ym) {
  const inM = v.txns.filter((t) => t.date && t.date.startsWith(ym));
  const income = r2(sum(inM.filter((t) => t.type === "income"), (t) => +t.amount));
  const takeHome = r2(sum(inM.filter((t) => t.type === "income" && t.category === "Salary"), (t) => +t.amount));
  const exp = inM.filter((t) => t.type === "expense");
  let spent = r2(sum(exp, (t) => +t.amount));
  const daily = r2(sum(exp.filter((t) => !t.link), (t) => +t.amount));
  const byCat = {}; exp.forEach((t) => (byCat[t.category || "Other"] = (byCat[t.category || "Other"] || 0) + (+t.amount)));
  const toCards = r2(sum(inM.filter((t) => t.type === "transfer" && t.link && t.link.kind === "bill"), (t) => +t.amount));
  let workShare = 0;
  (v.reimb || []).forEach((r) => {
    const m = Number(r.myShare) || 0; if (!r.claimed || !(m > 0) || !String(r.claimedDate || "").startsWith(ym)) return;
    const cat = r.rtype === "Meeting meals" ? "Dining out" : "Work (not reimbursed)";
    byCat[cat] = (byCat[cat] || 0) + m; workShare += m;
  });
  workShare = r2(workShare); spent = r2(spent + workShare);
  const workPaid = r2(sum((v.reimb || []).filter((r) => String(r.date).startsWith(ym)), (r) => +r.amount || 0));
  return { income, takeHome, spent, daily, byCat, toCards, workShare, workPaid };
}
function debtNow(v, bal) {
  const loans = sum(v.loans, (l) => loanState(v, l).balance);
  const cards = sum(v.settings.accounts.filter((a) => a.type === "credit" || a.type === "bnpl"), (a) => Math.max(0, -(bal[a.id] || 0)));
  return { loans: r2(loans), cards: r2(cards), total: r2(loans + cards) };
}
function personBal(p) { return r2((Number(p.start) || 0) + sum(p.entries || [], (e) => (e.k === "lend" ? 1 : -1) * (Number(e.a) || 0))); }
function projection(v, months) {
  const start = ymOf(todayStr()); const out = [];
  const state = {}; v.loans.forEach((l) => (state[l.id] = loanState(v, l).left));
  for (let k = 0; k < months; k++) {
    const ym = shiftYM(start, k); let tot = 0;
    ["A", "B"].forEach((c) => {
      v.loans.forEach((l) => {
        if (!(l.cycle === c || l.cycle === "AB")) return;
        const period = ym + "-" + c;
        if (periodPaid(v, "loan", l.id, period)) { tot += 0; return; }
        if (k === 0 && dueDate(ym, c) < (l.asOf || "0000")) return;
        if (state[l.id] > 0) { state[l.id]--; tot += Number(l.payment) || 0; }
      });
    });
    out.push({ ym, amt: r2(tot) });
  }
  return out;
}
function loanEnd(v, l) {
  let left = loanState(v, l).left; if (left <= 0) return null;
  let ym = ymOf(todayStr());
  for (let k = 0; k < 120; k++) {
    for (const c of ["A", "B"]) {
      if (!(l.cycle === c || l.cycle === "AB")) continue;
      if (periodPaid(v, "loan", l.id, ym + "-" + c)) continue;
      if (k === 0 && dueDate(ym, c) < (l.asOf || "0000")) continue;
      left--; if (left === 0) return dueDate(ym, c);
    }
    ym = shiftYM(ym, 1);
  }
  return null;
}

function niceScale(max, ticks) {
  max = Math.max(max, 1); const raw = max / (ticks || 4); const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map((s) => s * mag).find((s) => s >= raw); return { step, top: Math.ceil(max / step) * step };
}
function barChart(labels, series, opt) {

  const tick = opt.tick || ((n) => MK.format(n)), tip = opt.tipFmt || fmt;

  if (!(rawMax > 0)) return `<div class="empty">${esc(opt.empty || "Nothing logged yet. This fills in as you add entries.")}</div>`;
  const max = rawMax; const { step, top } = niceScale(max, 4);
  const iw = W - L - R, ih = H - T - B, y = (v) => T + ih - (v / top) * ih;
  const gw = iw / labels.length, n = series.length, bw = Math.min(28, (gw * 0.66) / n);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label || "Chart")}">`;
  for (let v = 0; v <= top + 1e-6; v += step) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v ? 'stroke-dasharray="3 4"' : ""}/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Google Sans Flex, Helvetica Neue, Helvetica, Arial, sans-serif">${esc(tick(v))}</text>`;
  labels.forEach((lb, i) => {

      s += `<rect x="${x}" y="${y(v)}" width="${bw}" height="${Math.max(0, y(0) - y(v))}" rx="3" fill="${se.color}" opacity="${opt.hi === undefined || hl ? 1 : 0.5}"><title>${esc(lb)} · ${esc(se.name || "")} ${esc(tip(v))}</title></rect>`;
      if (opt.valFmt && v > 0) { const t = opt.valFmt(v); if (t.length * 5.4 <= gw + 2) s += `<text x="${x + bw / 2}" y="${y(v) - 5}" text-anchor="middle" font-size="9.5" fill="var(--muted)" font-family="Google Sans Flex, Helvetica Neue, Helvetica, Arial, sans-serif">${esc(t)}</text>`; }

  });
  return s + "</svg>";
}
function lineChart(points, opt) {
  opt = opt || {}; const narrow = window.innerWidth < 560; const W = narrow ? 380 : 640, H = (opt.h || 200) * (narrow ? 0.85 : 1), L = 54, R = 14, T = 14, B = 28;

function tOverview(v) {

      <div class="cut-foot"><span class="note">${x.due ? fmt(x.due) + " still due" + (x.billed ? " + as billed" : "") : "Nothing left due"}</span><span class="pill ${ok ? "paid" : "over"}">${ok ? (x.exp ? "Should cover · " : "Covered · ") + fmt(x.left) + " left" : (x.exp ? "May fall short by " : "Short by ") + fmt(-x.left)}</span></div>
      ${x.exp ? `<p class="note">Payday not in yet; counting your last ${x.c === "A" ? "15th" : "30th"} take-home of ${fmt(x.exp)}.</p>` : ""}
    </div>`;
  };

  /* six months of income vs spending */

  const bRow = (label, val, cls, note) => `<div class="bal-row"><span>${label}${note ? `<span class="note"> · ${note}</span>` : ""}</span><span class="num ${cls || ""}">${fmt(val)}</span></div>`;

  return `
  <section class="panel kpis" aria-label="Snapshot">
    <div class="kpi hero"><span class="eyebrow">Net worth</span><span class="v ${netWorth < 0 ? "neg" : ""}">${fmt(netWorth)}</span><span class="s">Accounts and savings minus all debt</span></div>
    <div class="kpi"><span class="eyebrow">Money in · ${esc(ymShort(S.month))}</span><span class="v pos">${fmt(moneyIn)}</span><span class="s">${mf.takeHome ? fmt(mf.takeHome) + " salary" : "No payday logged yet"}</span></div>
    <div class="kpi"><span class="eyebrow">Money out · ${esc(ymShort(S.month))}</span><span class="v">${fmt(moneyOut)}</span><span class="s">${fmt(mf.daily)} daily · ${fmt(r2(moneyOut - mf.daily - mf.workShare))} bills &amp; loans${mf.workShare ? " · " + fmt(mf.workShare) + " work costs not reimbursed" : ""}</span></div>
    <div class="kpi"><span class="eyebrow">Left over so far</span><span class="v ${left < 0 ? "neg" : "pos"}">${fmt(left)}</span><span class="s">${rate === null ? "Log income to see your savings rate" : rate >= 0 ? rate + "% of what came in" : "Spent more than came in"}</span></div>
  </section>
  <div class="cols">
    <div class="stack">
      <section class="panel">
        <div class="phead"><h2>Does each payday cover its bills?</h2><span class="eyebrow">${esc(ymName(S.month))}</span></div>
        <div class="cuts">${cut.map(cutRow).join("")}</div>
        <div class="legend" style="margin-top:10px"><span><i style="background:var(--income)"></i>Came in</span><span><i style="background:var(--income);opacity:.35"></i>Expected payday</span><span><i style="background:var(--accent)"></i>Paid out</span><span><i style="background:var(--accent);opacity:.35"></i>Still due</span></div>
      </section>
      <section class="panel">
        <div class="phead"><h2>Income vs spending</h2><div class="legend"><span><i style="background:var(--income)"></i>In</span><span><i style="background:var(--porcelain)"></i>Out</span></div></div>
        <div class="chart">${barChart(months.map(ymShort), [{ name: "In", values: flows.map((f) => f.income), color: "var(--income)" }, { name: "Out", values: flows.map((f) => f.spent), color: "var(--porcelain)" }], { hi: 5, h: 210, label: "Income and spending for the last six months" })}</div>
        <div class="leftover-row">${months.map((m, i) => `<span><span class="note">${esc(ymShort(m))}</span><b class="num ${leftovers[i] < 0 ? "neg" : leftovers[i] > 0 ? "pos" : ""}">${flows[i].income || flows[i].spent ? (leftovers[i] < 0 ? "−" : "+") + esc(MK.format(Math.abs(leftovers[i]))) : "—"}</b></span>`).join("")}</div>
        <p class="note" style="margin-top:8px">${withIncome.length ? `On average you keep <b class="${avgLeft < 0 ? "neg" : "pos"}">${fmt(avgLeft)}</b> a month in months with income logged.` : "Log paydays to see what you keep each month."}</p>
      </section>
      <section class="panel">
        <div class="phead"><h2>Debt</h2><span class="eyebrow">Loans + card balances</span></div>
        <div class="debt-top"><div><span class="eyebrow">Total owed</span><div class="big-fig neg">${fmt(debt.total)}</div><span class="note">${fmt(debt.loans)} loans · ${fmt(debt.cards)} cards</span></div>
        <div><span class="eyebrow">Debt-free</span><div class="big-fig">${ends.length ? esc(ymName(ymOf(ends[ends.length - 1]), { month: "short", year: "numeric" })) : "—"}</div><span class="note">${ends.length ? "loans only, if you add no new ones" : "No active loans"}</span></div></div>
        <div class="chart">${lineChart(hist, { color: "var(--expense)", label: "Total debt over time", endLabel: MK.format(debt.total), h: 170 })}</div>
        ${freed > 0 ? `<div class="callout"><span>${soon.length} loan${soon.length > 1 ? "s" : ""} finish within 3 months, freeing</span><b>${fmt(freed)} a month</b><span class="note"><a href="#loans">See loans</a></span></div>` : ""}
      </section>
    </div>
    <div class="stack">
      <section class="panel">
        <div class="phead"><h2>Still to pay · ${esc(ymShort(S.month))}</h2><span class="num">${unpaid.length ? fmt(unpaidAmt) + (asBilled ? " +" : "") : ""}</span></div>
        <div class="rows">${unpaid.length ? unpaid.slice(0, 5).map((i) => dueRow(v, i)).join("") : `<div class="empty"><strong>All paid for ${esc(ymName(S.month))}</strong>Nothing left on either cutoff.</div>`}</div>
        ${unpaid.length > 5 ? `<p class="note" style="margin-top:8px"><a href="#bills">See all ${unpaid.length} in Bills</a></p>` : ""}
      </section>
      <section class="panel">
        <div class="phead"><h2>Budget pace</h2><span class="eyebrow">${isCur ? "Day " + Number(todayStr().slice(8)) + " of " + ld : esc(ymShort(S.month))}</span></div>
        ${bTotal ? `<div class="pace"><div class="pace-track"><i style="width:${Math.min(100, (bSpent / bTotal) * 100).toFixed(1)}%;background:${bSpent > bTotal ? "var(--expense)" : paceDiff > 0 ? "var(--warn)" : "var(--income)"}"></i><b style="left:${Math.min(100, dayFrac * 100).toFixed(1)}%" title="Even pace"></b></div>
          <div class="pace-nums"><span><span class="num">${fmt(bSpent)}</span> <span class="note">of ${fmt(bTotal)} budgeted</span></span><span class="pill ${bSpent > bTotal ? "over" : paceDiff > 0 ? "soon" : "paid"}">${bSpent > bTotal ? "Over budget" : paceDiff > 0 ? fmt(paceDiff) + " ahead of pace" : fmt(-paceDiff) + " under pace"}</span></div>
          <p class="note">The tick marks an even pace through the month.</p></div>` : `<div class="empty">Set monthly limits under <a href="#accounts">Accounts → Budgets &amp; categories</a> to track your pace.</div>`}
      </section>
      <section class="panel">
        <div class="phead"><h2>Where it went</h2><span class="eyebrow">${esc(ymName(S.month))}</span></div>
        ${cats.length ? cats.slice(0, 6).map(([c, a], i) => { const b = v.settings.budgets[c]; const pct = b ? a / b : a / catMax; return `<div class="catrow"><div class="top"><span>${esc(c)}</span><span>${fmt(a)}${b ? " / " + esc(M0.format(b)) : ""}</span></div><div class="prog ${b ? (pct > 1 ? "over" : pct > 0.85 ? "warn" : "good") : ""}"><i style="width:${Math.min(100, pct * 100).toFixed(1)}%;${b ? "" : "background:" + catColor(i)}"></i></div></div>`; }).join("") : `<div class="empty"><strong>No spending logged</strong>Add expenses in the Daily tab.</div>`}
      </section>
      <section class="panel">
        <div class="phead"><h2>Balances</h2><span class="eyebrow">Today</span></div>
        <div class="bal">
          ${bRow("Spending money", spendMoney, spendMoney < 0 ? "neg" : "", "banks, e-wallets, cash")}
          ${bRow("Savings &amp; investments", savings, "pos")}
          ${bRow("Card balances", -cards, "neg")}
          ${bRow("Loans", -loansBal, "neg")}
          <div class="bal-row total"><span>Net worth</span><span class="num ${netWorth < 0 ? "neg" : ""}">${fmt(netWorth)}</span></div>
        </div>
        ${(() => { const wr = r2(sum((v.reimb || []).filter((r) => !r.claimed), (r) => +r.amount || 0)); return owed || wr ? `<p class="note" style="margin-top:8px">Not counted in net worth: ${owed ? fmt(owed) + ` owed by people (<a href="#owed">Owed to me</a>)` : ""}${owed && wr ? " · " : ""}${wr ? fmt(wr) + ` waiting from ${esc(v.settings.payer || "DAP")} (<a href="#reimb">Reimbursements</a>)` : ""}.</p>` : ""; })()}
      </section>
    </div>
  </div>`;
}

function tDaily(v) {
  const today = todayStr();
  const inM = v.txns.filter((t) => t.type === "expense" && !t.link && t.date.startsWith(S.month)).sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));
  const todayTot = r2(sum(v.txns.filter((t) => t.type === "expense" && !t.link && t.date === today), (t) => +t.amount));
  const wkStart = (() => { const d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); })();
  const weekTot = r2(sum(v.txns.filter((t) => t.type === "expense" && !t.link && t.date >= wkStart && t.date <= today), (t) => +t.amount));
  const monthTot = r2(sum(inM, (t) => +t.amount));
  const cats = v.settings.categories && v.settings.categories.length ? v.settings.categories : DEFAULT_CATS;
  if (!cats.includes(S.dayCat)) S.dayCat = cats[0];
  const groups = {}; inM.forEach((t) => (groups[t.date] = groups[t.date] || []).push(t));
  const defAcct = (v.settings.accounts.find((a) => a.type === "cash") || v.settings.accounts.find((a) => a.type === "ewallet") || v.settings.accounts[0] || {}).id;
  return `
  <section class="panel kpis" aria-label="Daily totals">
    <div class="kpi hero"><span class="eyebrow">Today</span><span class="v">${fmt(todayTot)}</span><span class="s">${esc(dLabel(today))}</span></div>
    <div class="kpi"><span class="eyebrow">This week</span><span class="v">${fmt(weekTot)}</span><span class="s">Since Monday</span></div>
    <div class="kpi"><span class="eyebrow">${esc(ymShort(S.month))} so far</span><span class="v">${fmt(monthTot)}</span><span class="s">${inM.length} entries</span></div>
    <div class="kpi"><span class="eyebrow">Daily average</span><span class="v">${fmt(monthTot / Math.max(1, S.month === ymOf(today) ? Number(today.slice(8)) : lastDay(S.month)))}</span><span class="s">Excludes bills &amp; loans</span></div>
  </section>
  <div class="cols">
    <section class="panel">
      <div class="phead"><h2>Spending log</h2><span class="eyebrow">${esc(ymName(S.month))}</span></div>
      ${inM.length ? Object.keys(groups).sort().reverse().map((d) => `<div class="day-head"><span>${esc(dLabel(d))}</span><span class="num">${fmt(sum(groups[d], (t) => +t.amount))}</span></div>` + groups[d].map((t) => `<button type="button" class="row" data-act="edittx" data-id="${esc(t.id)}"><span class="bar6" style="background:var(--expense)"></span><span style="min-width:0"><span class="t" style="display:block">${esc(t.category)}</span><span class="m" style="display:block">${esc([t.note, acctName(v, t.account)].filter(Boolean).join(" · "))}</span></span><span class="r"><span class="amt">${fmt(t.amount)}</span></span></button>`).join("")).join("") : `<div class="empty"><strong>Nothing logged for ${esc(ymName(S.month))}</strong>Use the quick add to record what you spend each day.</div>`}
    </section>
    <section class="panel">
      <div class="phead"><h2>Quick add</h2></div>
      <form class="quick" id="quickForm" novalidate>
        <div class="amount-field"><span>₱</span><input id="qAmt" inputmode="decimal" placeholder="0.00" autocomplete="off" aria-label="Amount"></div>
        <div><div class="lbl" style="margin-bottom:6px">Category</div><div class="catchips" id="qCats">${cats.map((c) => `<button type="button" data-cat="${esc(c)}" aria-pressed="${c === S.dayCat}">${esc(c)}</button>`).join("")}</div></div>
        <div class="grid2">
          <div class="field"><label for="qAcct">Paid with</label><select id="qAcct">${acctOpts(v, defAcct)}</select></div>
          <div class="field"><label for="qDate">Date</label><input type="date" id="qDate" value="${today.startsWith(S.month) ? today : S.month + "-01"}"></div>
        </div>
        <div class="field"><label for="qNote">Note (optional)</label><input id="qNote" maxlength="120" placeholder="e.g. Lunch at the canteen" autocomplete="off"></div>
        <p class="err" id="qErr" hidden></p>
        <button type="submit" class="btn primary" style="padding:12px">Add expense</button>
      </form>
    </section>
  </div>`;
}

function tBills(v) {
  const items = dueItems(v, S.month);
  const col = (c) => {
    const its = items.filter((i) => i.cycle === c).sort((a, b) => (a.paid ? 1 : 0) - (b.paid ? 1 : 0) || a.name.localeCompare(b.name));
    const paidAmt = r2(sum(its.filter((i) => i.paid), (i) => +i.paid.amount));
    const leftAmt = r2(sum(its.filter((i) => !i.paid), (i) => Number(i.amount) || 0));
    return `<div><div class="cut-head"><h3>${c === "A" ? "15th" : "30th"} cutoff</h3><span class="note">Due ${esc(dShort(dueDate(S.month, c)))}</span></div>
      <div class="rows">${its.length ? its.map((i) => dueRow(v, i)).join("") : `<div class="empty">Nothing on this cutoff.</div>`}</div>
      <div class="cut-foot"><span>Paid <span class="num">${fmt(paidAmt)}</span></span><span>Left <span class="num">${fmt(leftAmt)}${its.some((i) => !i.paid && !i.amount) ? " + as billed" : ""}</span></span></div></div>`;
  };
  const fromBorrowed = v.txns.filter((t) => t.date.startsWith(S.month) && t.link && (t.link.kind === "bill" || t.link.kind === "loan") && (v.settings.accounts.find((a) => a.id === t.account) || {}).type in { credit: 1, bnpl: 1 });
  return `
  <section class="panel">
    <div class="phead"><h2>Bills &amp; loan payments · ${esc(ymName(S.month))}</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn small" data-act="newbill">Add a bill</button><button type="button" class="btn small" data-act="managebills">Edit bills</button></div></div>
    <div class="cutoffs">${col("A")}${col("B")}</div>
    ${fromBorrowed.length ? `<div class="callout" style="background:color-mix(in srgb, var(--warn) 14%, transparent)"><span class="warn-t" style="font-weight:600">Heads-up</span><span>${fromBorrowed.length} payment${fromBorrowed.length > 1 ? "s" : ""} this month came from a credit card or credit line: ${esc(fromBorrowed.map((t) => t.note || "payment").join(", "))}. That moves the balance rather than clearing it.</span></div>` : ""}
  </section>
  <p class="note">Tap any item to mark it paid, change the amount, or undo a payment. Loans come from the Loans tab automatically.</p>`;
}

function tLoans(v) {
  const list = v.loans.map((l) => ({ l, s: loanState(v, l), end: loanEnd(v, l) })).sort((a, b) => (a.s.balance > 0 ? 0 : 1) - (b.s.balance > 0 ? 0 : 1) || (a.end || "9").localeCompare(b.end || "9"));
  const active = list.filter((x) => x.s.balance > 0);
  const monthly = r2(sum(active, (x) => (Number(x.l.payment) || 0) * (x.l.cycle === "AB" ? 2 : 1)));
  const total = r2(sum(active, (x) => x.s.balance));
  return `
  <section class="panel kpis">
    <div class="kpi hero"><span class="eyebrow">Loans outstanding</span><span class="v neg">${fmt(total)}</span><span class="s">${active.length} active loans</span></div>
    <div class="kpi"><span class="eyebrow">Monthly payments</span><span class="v">${fmt(monthly)}</span><span class="s">Scheduled</span></div>
    <div class="kpi"><span class="eyebrow">Next to finish</span><span class="v" style="font-size:1.05rem">${active[0] && active[0].end ? esc(active[0].l.name) : "—"}</span><span class="s">${active[0] && active[0].end ? "Last payment " + esc(dShort(active[0].end)) : ""}</span></div>
    <div class="kpi"><span class="eyebrow">Debt-free date</span><span class="v" style="font-size:1.05rem">${(() => { const ends = active.map((x) => x.end).filter(Boolean).sort(); return ends.length ? esc(ymName(ymOf(ends[ends.length - 1]))) : "—"; })()}</span><span class="s">If no new loans</span></div>
  </section>
  <section class="panel">
    <div class="phead"><h2>Your loans</h2><button type="button" class="btn small primary" data-act="newloan">Add a loan</button></div>
    ${list.length ? `<div class="cards">${list.map(({ l, s, end }) => { const orig = Number(l.original) || Number(l.balance) || 1; const pct = Math.min(1, Math.max(0, 1 - s.balance / orig)); return `<article class="card">
      <div class="ct"><div><h3>${esc(l.name)}</h3><span class="note">${esc(l.lender || "")}</span></div>${s.balance <= 0 ? '<span class="pill paid">Paid off</span>' : `<span class="pill up">${CYC[l.cycle] || ""}</span>`}</div>
      <div><span class="eyebrow">Remaining</span><div class="big ${s.balance > 0 ? "neg" : "pos"}">${fmt(s.balance)}</div></div>
      <div class="prog good" title="${Math.round(pct * 100)}% paid"><i style="width:${(pct * 100).toFixed(1)}%"></i></div>
      <dl class="kv"><dt>Payment</dt><dd>${fmt(l.payment)}${l.cycle === "AB" ? " ×2/mo" : ""}</dd><dt>Payments left</dt><dd>${s.left}</dd><dt>Last payment</dt><dd>${end ? esc(dShort(end)) + " " + end.slice(0, 4) : "—"}</dd><dt>Paid so far</dt><dd>${Math.round(pct * 100)}%</dd></dl>
      <div class="acts"><button type="button" class="btn small" data-act="loanpay" data-id="${esc(l.id)}"${s.balance <= 0 ? " disabled" : ""}>Record payment</button><button type="button" class="btn small ghost" data-act="editloan" data-id="${esc(l.id)}">Edit</button></div>
    </article>`; }).join("")}</div>` : `<div class="empty"><strong>No loans recorded</strong>Add each loan with its remaining balance and payment schedule.</div>`}
  </section>`;
}

function tSalary(v) {
  const sal = v.txns.filter((t) => t.type === "income" && t.category === "Salary").sort((a, b) => a.date.localeCompare(b.date));
  const other = v.txns.filter((t) => t.type === "income" && t.category !== "Salary" && t.date.startsWith(S.month));
  const months = []; for (let k = 5; k >= 0; k--) months.push(shiftYM(S.month, -k));
  const byM = months.map((ym) => sal.filter((t) => t.date.startsWith(ym)));
  const yr = S.month.slice(0, 4);
  const ytd = sal.filter((t) => t.date.startsWith(yr));
  const lost = r2(sum(ytd, (t) => (t.details ? (+t.details.tardy || 0) + (+t.details.absent || 0) : 0)));
  const ytdNet = r2(sum(ytd, (t) => +t.amount));
  const ytdEq = r2(sum(ytd, (t) => (t.details ? +t.details.equity || 0 : 0)));
  const ded = (t, k) => (t.details ? Number(t.details[k]) || 0 : 0);
  return `
  <section class="panel kpis">
    <div class="kpi hero"><span class="eyebrow">Take-home ${esc(yr)}</span><span class="v pos">${fmt(ytdNet)}</span><span class="s">${ytd.length} paydays logged</span></div>
    <div class="kpi"><span class="eyebrow">Average per month</span><span class="v">${fmt(ytdNet / Math.max(1, new Set(ytd.map((t) => ymOf(t.date))).size))}</span><span class="s">Net of deductions</span></div>
    <div class="kpi"><span class="eyebrow">Saved via payroll</span><span class="v">${fmt(ytdEq)}</span><span class="s">Coop equity deductions</span></div>
    <div class="kpi"><span class="eyebrow">Lost to tardy &amp; absences</span><span class="v ${lost ? "neg" : ""}">${fmt(lost)}</span><span class="s">${esc(yr)} so far</span></div>
  </section>
  <div class="cols">
    <section class="panel">
      <div class="phead"><h2>Paydays</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn small primary" data-act="newsalary">Log payday</button><button type="button" class="btn small" data-act="newincome">Other income</button></div></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Payday</th><th>Gross</th><th>Tax</th><th>Coop &amp; HMO</th><th>Tardy/abs.</th><th>Net</th></tr></thead><tbody>
      ${sal.filter((t) => t.date.startsWith(S.month) || months.includes(ymOf(t.date))).reverse().map((t) => `<tr class="clickable" data-act="editsalary" data-id="${esc(t.id)}"><td>${esc(dShort(t.date))}</td><td>${fmt(ded(t, "gross"))}</td><td>${fmt(ded(t, "tax"))}</td><td>${fmt(ded(t, "hmo") + ded(t, "equity") + ded(t, "coop"))}</td><td class="${ded(t, "tardy") + ded(t, "absent") ? "neg" : ""}">${fmt(ded(t, "tardy") + ded(t, "absent"))}</td><td class="pos">${fmt(t.amount)}</td></tr>`).join("") || `<tr><td colspan="6" style="text-align:center;color:var(--muted);font-family:var(--f-body)">No paydays logged in the last 6 months.</td></tr>`}
      </tbody></table></div>
    </section>
    <div class="stack">
      <section class="panel">
        <div class="phead"><h2>Net pay by month</h2></div>
        <div class="chart">${barChart(months.map(ymShort), [{ name: "Net pay", values: byM.map((a) => r2(sum(a, (t) => +t.amount))), color: "var(--income)" }], { hi: 5, h: 200, label: "Net pay by month" })}</div>
      </section>
      <section class="panel">
        <div class="phead"><h2>Other income · ${esc(ymShort(S.month))}</h2></div>
        <div class="rows">${other.length ? other.map((t) => `<button type="button" class="row" data-act="editincome" data-id="${esc(t.id)}"><span class="bar6" style="background:var(--income)"></span><span style="min-width:0"><span class="t" style="display:block">${esc(t.category)}</span><span class="m" style="display:block">${esc([dShort(t.date), t.note].filter(Boolean).join(" · "))}</span></span><span class="r"><span class="amt pos">+${fmt(t.amount)}</span></span></button>`).join("") : `<div class="empty">No bonuses, reimbursements or side income this month.</div>`}</div>
      </section>
    </div>
  </div>`;
}

function tOwed(v) {
  const list = v.people.map((p) => ({ p, b: personBal(p) })).sort((a, b) => b.b - a.b);
  const total = r2(sum(list, (x) => Math.max(0, x.b)));
  const ym = S.month;
  const repaidM = r2(sum(v.people.flatMap((p) => p.entries || []).filter((e) => e.k === "repay" && e.d.startsWith(ym)), (e) => +e.a));
  const lentM = r2(sum(v.people.flatMap((p) => p.entries || []).filter((e) => e.k === "lend" && e.d.startsWith(ym)), (e) => +e.a));
  return `
  <section class="panel kpis">
    <div class="kpi hero"><span class="eyebrow">Owed to you</span><span class="v">${fmt(total)}</span><span class="s">${(() => { const n = list.filter((x) => x.b > 0).length; return n === 1 ? "1 person" : n + " people"; })()}</span></div>
    <div class="kpi"><span class="eyebrow">Lent · ${esc(ymShort(ym))}</span><span class="v neg">${fmt(lentM)}</span><span class="s">New this month</span></div>
    <div class="kpi"><span class="eyebrow">Collected · ${esc(ymShort(ym))}</span><span class="v pos">${fmt(repaidM)}</span><span class="s">Paid back</span></div>
    <div class="kpi"><span class="eyebrow">Biggest balance</span><span class="v" style="font-size:1.05rem">${list[0] ? esc(list[0].p.name) : "—"}</span><span class="s">${list[0] ? fmt(list[0].b) : ""}</span></div>

function tHouse(v) {

  const mine = (u) => r2(tot(u) - sum(mates, (m) => share(u, m)));

  const latestE = rows.find((u) => +u.elec > 0);

  const small = (vals, color, name, unit, dec) => barChart(lbl, [{ name, values: vals, color }], { h: 150, w: 420, tick: numTick, valFmt: (n) => n.toFixed(dec), tipFmt: (n) => n.toFixed(dec) + " " + unit, label: name + " by month", empty: "Add " + unit + " to your bills to see this." });
  const statRow = (items) => `<div class="ustats">${items.map(([k, val]) => `<div><span class="eyebrow">${k}</span><b class="num">${val}</b></div>`).join("")}</div>`;

    <div class="kpi"><span class="eyebrow">Avg daily cost · latest</span><span class="v">${daily ? fmt(daily) : "—"}</span><span class="s">${latestE ? "Electricity, " + esc(ymName(latestE.id)) : "No electricity bill yet"}</span></div>

const rcToTxt = (l) => (l || []).filter((r) => r && r.url).map((r) => String(r.name || "receipt").replace(/\s*\|\s*/g, " ").replace(/\n/g, " ") + " | " + r.url).join("\n");
const txtToRc = (s) => String(s || "").split(/\n+/).map((ln) => { ln = ln.trim(); if (!ln) return null; const i = ln.lastIndexOf(" | "); const name = i >= 0 ? ln.slice(0, i) : "Receipt"; const url = i >= 0 ? ln.slice(i + 3).trim() : ln; const m = /\/d\/([^/?#]+)/.exec(url) || /[?&]id=([^&#]+)/.exec(url); return /^https?:/.test(url) ? { id: m ? m[1] : "", name, url } : null; }).filter(Boolean);
const rcClean = (l) => (l || []).filter((r) => r && !r.uploading).map((r) => { const o = { id: r.id || "", name: r.name || "Receipt", url: r.url || "" }; if (r.thumb) o.thumb = r.thumb; return o; });
async function prepFile(f) {
  if (!/^image\/(jpeg|png|webp|heic|heif)$/i.test(f.type || "")) return f;
  try {
    const bmp = await createImageBitmap(f); const sc = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise((res) => c.toBlob(res, "image/jpeg", 0.82));
    return b && (b.size < f.size || /heic|heif/i.test(f.type)) ? b : f;
  } catch (e) { return f; }
}
let RCS = { list: [], busy: 0 };
function receiptField() {
  return `<div class="field"><span class="lbl">Receipts</span><div class="rcs" id="rcList"></div><div class="rc-add"><label class="btn small" for="rcFile">Attach receipt</label><input type="file" id="rcFile" class="vh" accept="image/*,application/pdf" multiple><span class="note">Photo, screenshot or PDF. Saved to “Prudence Receipts” in your Google Drive.</span></div></div>`;
}
function drawRc() {
  const el = $("rcList"); if (!el) return;
  el.innerHTML = RCS.list.map((r, i) => `<span class="rc">${r.thumb ? `<img src="${esc(r.thumb)}" alt="">` : ""}<span class="rcn">${r.uploading ? "Uploading… " : ""}${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener" data-act="openrc">${esc(r.name)}</a>` : esc(r.name)}</span>${r.uploading ? "" : `<button type="button" class="rcx" data-act="rcrm" data-i="${i}" aria-label="Remove ${esc(r.name)}">×</button>`}</span>`).join("") || `<span class="note">No receipt attached.</span>`;
}
function wireReceipts(list, nameFn) {
  RCS = { list: rcClean(list), busy: 0 }; drawRc();
  const input = $("rcFile"); if (!input) return;
  input.addEventListener("change", async (e) => {
    const files = Array.from(e.target.files || []); e.target.value = "";
    for (const f of files) {
      if (f.size > 25e6) { toast(f.name + " is over 25 MB. Try a screenshot or a smaller photo."); continue; }
      const mine = RCS; const tmp = { id: "", name: f.name, url: "", uploading: true }; mine.list.push(tmp); mine.busy++; drawRc();
      try {
        const blob = await prepFile(f);
        const base = String((nameFn && nameFn()) || f.name.replace(/\.[^.]+$/, "")).replace(/[\\/:*?"<>|\n]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 90) || "Receipt";
        Object.assign(tmp, await uploadReceipt(blob, base), { uploading: false });
      } catch (err) {
        mine.list = mine.list.filter((x) => x !== tmp);
        toast(err && err.code === "offline" ? "You're offline. Save the entry now and attach the receipt when you're back online." : "Couldn't upload " + f.name + ". " + ((err && err.message) || ""));
      } finally { mine.busy--; if (mine === RCS) drawRc(); }
    }
  });
}
const rcLinks = (l, label) => (l || []).map((r, i) => r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener" data-act="openrc">${esc(label || "Receipt")}${(l.length > 1 ? " " + (i + 1) : "")}</a>` : `<span class="note">${esc(label || "Receipt")} (sample)</span>`).join(" · ");

}
function closeSheet() { $("overlay").hidden = true; document.body.style.overflow = ""; sheetSubmit = null; }
const shErr = (m) => { $("shErr").textContent = m; $("shErr").hidden = false; };
const val = (id) => ($(id) ? $(id).value : "");
const fld = (id, label, input) => `<div class="field"><label for="${id}">${label}</label>${input}</div>`;
const inp = (id, value, attrs) => `<input id="${id}" value="${esc(value ?? "")}" ${attrs || ""}>`;

function sheetPay(v, kind, id, period) {
  const it = dueItems(v, period.slice(0, 7)).find((i) => i.kind === kind && i.id === id && i.period === period);
  if (!it) return;
  const p = it.paid;
  const payTo = kind === "bill" && it.obj.payTo;
  const def = p ? p.account : (v.settings.salary && v.settings.salary.account) || (v.settings.accounts[0] || {}).id;
  openSheet((p ? "Payment: " : "Pay ") + it.name, `
    <p class="note">${CYC[it.cycle]} cutoff · due ${esc(dLabel(it.due))}${kind === "loan" ? " · " + plural(loanState(v, it.obj).left, "payment") + " left" : ""}${payTo ? " · goes to " + esc(acctName(v, payTo)) : ""}</p>
    <div class="grid2">${fld("pAmt", "Amount", money("pAmt", p ? p.amount : it.amount))}${fld("pDate", "Paid on", inp("pDate", p ? p.date : todayStr(), 'type="date"'))}</div>
    ${fld("pAcct", "Paid from", `<select id="pAcct">${acctOpts(v, def, (a) => a.id !== payTo)}</select>`)}
    ${fld("pNote", "Note", inp("pNote", p ? p.note : it.name, 'maxlength="120"'))}
    ${receiptField()}`,
    async () => {
      const amount = num(val("pAmt")); if (!(amount > 0)) return shErr("Enter the amount you paid.");
      if (!val("pDate")) return shErr("Pick the payment date.");
      if (RCS.busy) return shErr("Wait for the receipt to finish uploading.");
      const t = { id: p ? p.id : newId("t"), date: val("pDate"), type: payTo ? "transfer" : "expense", to: payTo || "", amount, account: val("pAcct"), category: it.category || "Other bills", note: val("pNote").trim(), link: { kind, id, period }, receipts: rcClean(RCS.list), createdAt: p ? p.createdAt || Date.now() : Date.now() };
      if (await act(() => store.put("txns", t), p ? "Payment updated" : it.name + " marked paid")) { await recordDebt(); closeSheet(); }
    }, p ? `<button type="button" class="btn danger" data-act="sheetdel" id="shDel">Undo payment</button>` : "");
  sheetDelete = p ? async () => { if (await act(() => store.del("txns", p.id), "Payment removed")) { await recordDebt(); closeSheet(); } } : null;
  wireReceipts(p && p.receipts, () => (val("pDate") || todayStr()).slice(0, 7) + " " + it.name + " " + (num(val("pAmt")) > 0 ? num(val("pAmt")).toFixed(2) : ""));
}

/* ============ reimbursements ============ */
function reimbCalc(v, r) {
  const cap = Number(v.settings.mealCap) || 150;
  const isMeal = r.rtype === "Meeting meals";
  const hc = Math.max(1, Math.round(Number(r.headcount) || 1));
  const amt = Number(r.amount) || 0;
  const within = isMeal ? Math.min(amt, r2(cap * hc)) : amt;
  return { cap, isMeal, hc, amt, within: r2(within), excess: r2(Math.max(0, amt - within)) };
}
/* split what wasn't covered equally among everyone who ate; staff shares are exact to the centavo, you take the remainder */
function splitShares(uncovered, hc, staffCount) {
  const each = Math.round((uncovered / hc) * 100) / 100;
  const staffTotal = r2(each * staffCount);
  return { each, staffTotal, mine: r2(uncovered - staffTotal) };
}
function outcomeText(v, r) {
  const payer = v.settings.payer || "DAP"; const c = reimbCalc(v, r);
  if (!r.claimed) return c.excess > 0 ? `${fmt(c.excess)} over the cap · waiting on ${payer}` : "";
  const rec = Number(r.received) || 0;
  if (rec >= c.amt) return c.excess > 0 ? `Excess of ${fmt(c.excess)} covered by ${payer}` : "";
  if (c.isMeal) return `${fmt(r2(c.amt - rec))} not covered · split ${c.hc} ways, ${fmt(+r.staffShare || 0)} each`;
  return `${fmt(r2(c.amt - rec))} not reimbursed · counted as yours`;
}
async function doClaim(v, r, received, toAccount, date) {
  const c = reimbCalc(v, r); const payer = v.settings.payer || "DAP";
  const uncovered = r2(Math.max(0, c.amt - received));
  let outcome = "", each = 0, mine = 0; const staffEntries = [];
  if (c.excess > 0 && uncovered === 0) outcome = "Covered by " + payer;
  if (uncovered > 0) {
    if (c.isMeal) {
      const staff = r.attendees || [];
      const sp = splitShares(uncovered, c.hc, staff.length); each = sp.each; mine = sp.mine; outcome = "Split " + c.hc + " ways";
      for (const name of staff) {
        const found = S.people.find((x) => x.name.trim().toLowerCase() === name.trim().toLowerCase());
        const p = found ? clone(found) : { id: newId("p"), name, start: 0, startDate: date, entries: [] };
        const e = { id: newId("e"), d: date, k: "lend", a: each, n: `${r.vendor || "Meal"} · ${r.event || "meeting"} excess (${dShort(r.date)})` };
        p.entries = (p.entries || []).concat([e]);
        await store.put("people", p);

function sheetClaim(v, r) {

  const def = v.settings.reimbAcct || (v.settings.salary && v.settings.salary.account) || (v.settings.accounts.find((a) => ["bank", "ewallet"].includes(a.type)) || {}).id;

    <p class="note">${esc(dLabel(r.date))} · ${esc(r.vendor || "")} · ${esc(r.rtype)} · ${fmt(c.amt)}${c.isMeal ? ` · ${c.hc} people, cap ${fmt(c.cap)} each` : ""}</p>

      <div class="choice">${opts.map(([k, l, s], i) => `<label class="opt"><input type="radio" name="cOut" value="${k}"${i === 0 ? " checked" : ""}><span><b>${l}</b>${s ? `<span class="note">${s}</span>` : ""}</span></label>`).join("")}</div></div>
    <div id="cOtherWrap" hidden>${fld("cOther", "Amount received", money("cOther", ""))}</div>
    <div class="grid2">${fld("cAcct", "Received in", `<select id="cAcct">${acctOpts(v, def, (a) => !["credit", "bnpl"].includes(a.type))}</select>`)}${fld("cDate", "Received on", inp("cDate", todayStr(), 'type="date"'))}</div>
    <p class="callout" id="cPrev" style="display:block"></p>`,
    async () => {
      const k = (document.querySelector('input[name="cOut"]:checked') || {}).value;
      const rec = k === "full" ? c.amt : k === "cap" ? c.within : num(val("cOther"));
      if (!(rec >= 0) || (k === "other" && !val("cOther").trim())) return shErr("Enter the amount you received.");
      if (rec > c.amt) return shErr("That's more than you paid. Enter " + fmt(c.amt) + " or less.");
      if (!val("cAcct")) return shErr("Add an account to receive the money into.");
      const acct = val("cAcct");
      const ok = await act(async () => {
        await doClaim(v, r, rec, acct, val("cDate") || todayStr());
        if (v.settings.reimbAcct !== acct) { const st = Object.assign(clone(DEFAULT_SETTINGS), S.settings || {}); st.reimbAcct = acct; await store.saveSettings(st); }
      }, "Claimed " + fmt(rec));
      if (ok) closeSheet();
    });
  $("shSave").textContent = "Mark claimed";
  const upd = () => {
    const k = (document.querySelector('input[name="cOut"]:checked') || {}).value; $("cOtherWrap").hidden = k !== "other";
    const rec = k === "full" ? c.amt : k === "cap" ? c.within : (num(val("cOther")) || 0);
    const unc = r2(Math.max(0, c.amt - rec)); let msg;
    if (unc <= 0) msg = c.excess > 0 ? `No one is charged. The ${fmt(c.excess)} is recorded as covered by ${esc(payer)}.` : `${fmt(rec)} is recorded as reimbursement into the account below.`;
    else if (c.isMeal) {
      const sp = splitShares(unc, c.hc, staff.length); const untracked = Math.max(0, c.hc - 1 - staff.length);
      msg = `${fmt(unc)} not covered: <b>${fmt(sp.each)}</b> each for ${c.hc} people. ${staff.length ? "Added to Owed to me for " + staff.map(esc).join(", ") + "." : "No staff are ticked on this meal."} Your share: ${fmt(sp.mine)}${untracked ? ` (includes ${untracked} attendee${untracked > 1 ? "s" : ""} not on your staff list)` : ""}.`;
    } else msg = `${fmt(unc)} not reimbursed. It counts as your own expense.`;
    $("cPrev").innerHTML = msg;
  };
  $("sheetForm").addEventListener("input", upd); $("sheetForm").addEventListener("change", upd); upd();
}

/* keep a dated debt total so the history chart grows as you use the app */
async function recordDebt() {
  if (V().demo || !S.settingsExists) return;
  const v = V(); const total = debtNow(v, balances(v)).total; const d = todayStr();
  const st = Object.assign(clone(DEFAULT_SETTINGS), S.settings || {});
  const h = (st.history || []).filter((x) => x[0] !== d);
  const lastV = h.length ? h.slice().sort((a, b) => a[0].localeCompare(b[0]))[h.length - 1][1] : null;
  if (lastV === total) return;
  h.push([d, total]); st.history = h.sort((a, b) => a[0].localeCompare(b[0])).slice(-120);
  try { await store.saveSettings(st); } catch (e) { /* history is a convenience */ }
}

document.addEventListener("submit", async (e) => {
  if (e.target.id === "sheetForm") { e.preventDefault(); if (sheetSubmit) { $("shSave").disabled = true; try { await sheetSubmit(); } finally { if ($("shSave")) $("shSave").disabled = false; } } }
  if (e.target.id === "quickForm") {
    e.preventDefault();
    const v = V(); const err = (m) => { $("qErr").textContent = m; $("qErr").hidden = false; };
    const amount = num(val("qAmt")); if (!(amount > 0)) return err("Enter an amount greater than zero.");
    if (!v.demo && !v.settings.accounts.length) return err("Add an account first in the Accounts tab.");
    if (v.demo) return toast("These are samples. Tap “Start my ledger” at the top first.");
    const t = { id: newId("t"), date: val("qDate") || todayStr(), type: "expense", amount, account: val("qAcct"), category: S.dayCat, note: val("qNote").trim(), to: "", link: null, createdAt: Date.now() };
    if (await act(() => store.put("txns", t), fmt(amount) + " · " + S.dayCat + " added")) { const q = $("qAmt"); if (q) { q.value = ""; q.focus(); } if ($("qNote")) $("qNote").value = ""; }
  }
});
document.addEventListener("click", (e) => { const c = e.target.closest("#qCats button"); if (!c) return; S.dayCat = c.dataset.cat; document.querySelectorAll("#qCats button").forEach((b) => b.setAttribute("aria-pressed", String(b === c))); });
$("overlay").addEventListener("click", (e) => { if (e.target === $("overlay")) closeSheet(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("overlay").hidden) closeSheet();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
});
$("prevM").addEventListener("click", () => { S.month = shiftYM(S.month, -1); render(); });
$("nextM").addEventListener("click", () => { S.month = shiftYM(S.month, 1); render(); });
$("fab").addEventListener("click", () => { location.hash = "daily"; setTimeout(() => $("qAmt") && $("qAmt").focus(), 50); });
function fromHash() { const h = (location.hash || "").replace("#", ""); S.tab = TABS.some(([k]) => k === h) ? h : "overview"; if (S.mode === "ready") render(); }
window.addEventListener("hashchange", () => { if (/access_token=|error=/.test(location.hash)) return; fromHash(); window.scrollTo(0, 0); });

let toastT = 0;
function toast(m) { const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 3000); }

let wasNarrow = window.innerWidth < 560;
window.addEventListener("resize", () => { const n = window.innerWidth < 560; if (n !== wasNarrow) { wasNarrow = n; if ($("overlay").hidden && !(document.activeElement && document.activeElement.closest && document.activeElement.closest("#quickForm"))) render(); } });
if (!/access_token=|error=/.test(location.hash)) fromHash();
boot().then(() => fromHash());
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
